<h2>Progress Notes</h2>
<div>
  <label for="progress-note">Progress Note:</label>
  <input id="progress-note" type="text" [(ngModel)]="progressNote">
</div>
<div>
  <label for="progress-code">Progress Code:</label>
  <input id="progress-code" type="text" (input)="codeInput()" [(ngModel)]=" projectCode">
</div>
<p>Project Name: {{ projectName2 }}</p>
<p>Current Note: {{ progressNote }}</p>
